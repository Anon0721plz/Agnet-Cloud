# =====================================================================
# Agent Cloud 一体化 Nacos（merged：server 8848 + console 8080）
# 由 E:\nacos3.2.3\nacos\conf\application.properties 整理而来，
# 直连同一 MySQL 库 nacos-agent-cloud，与部署目录共用数据
# =====================================================================
nacos:
  # ---- Server 主端口（8848，OpenAPI/Admin API/客户端注册）----
  server:
    main:
      port: ${NACOS_SERVER_MAIN_PORT:8848}
    contextPath: /nacos
  # ---- Console 端口（8080，UI + /v3/console/*）----
  console:
    port: ${NACOS_CONSOLE_PORT:8080}
    contextPath: ""
    ui:
      enabled: true
      default: next
  # ---- 鉴权（与部署包 conf 保持一致）----
  core:
    auth:
      system:
        type: nacos
      # SDK/gRPC 请求鉴权开关，对齐部署包取 false
      enabled: false
      # /v3/admin/* 鉴权开关，对齐部署包取 true
      admin:
        enabled: true
      # /v3/console/* 鉴权开关，对齐部署包取 true
      console:
        enabled: true
      caching:
        enabled: true
      # Server 间身份识别键值，与部署包一致
      server:
        identity:
          key: myCustomKey
          value: myCustomValue
      plugin:
        nacos:
          token:
            cache:
              enable: false
            expire:
              seconds: 18000
            # token 密钥（Base64），与部署包一致
            secret:
              key: VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
  security:
    ignore:
      # 忽略鉴权的 URL，与部署包 conf 完全一致
      urls: /,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/next/**,/legacy/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**
  config:
    push:
      maxRetryTime: 50
  naming:
    empty-service:
      auto-clean: true
      clean:
        initial-delay-ms: 50000
        period-time-ms: 30000

# 数据库（与部署包 conf 一致，nacos-agent-cloud 库）
spring:
  sql:
    init:
      platform: mysql
  jmx:
    # IDEA 启动 Spring Boot 会默认加 -Dspring.jmx.enabled=true，core/web/console 三个上下文
    # 会向同一个 MBeanServer 重复注册同名 Hikari dataSource MBean 导致启动失败；忽略已存在的注册
    registration-policy: ignoreExisting
  banner:
    # 启动时打印 Nacos Console banner
    location: classpath:nacos-console-banner.txt
  servlet:
    multipart:
      # Console 上传文件大小限制（如 skill zip），与部署包一致
      max-file-size: 10MB
      max-request-size: 10MB

db:
  num: 1
  url:
    0: jdbc:mysql://127.0.0.1:3306/nacos-agent-cloud?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC
  user: root
  password: 123456

# Tomcat 访问日志（对齐部署包；目录统一收到 nacos-home 下，避免污染工程目录）
server:
  tomcat:
    basedir: ${nacos.home}
    accesslog:
      enabled: true
      max-days: 30
      pattern: '%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i'
  error:
    include-message: ALWAYS

management:
  metrics:
    export:
      elastic:
        enabled: false
      influx:
        enabled: false
