server:
  port: 9001

spring:
  application:
    name: agent-cloud-nacos
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
