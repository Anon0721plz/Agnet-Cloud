server:
  port: 9003

spring:
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
        server:
          address: 127.0.0.1
          version: 1.0.0
          card:
            url: http://127.0.0.1:9003/a2a
            name: agent-cloud-assistant
            description: Agent Cloud 基础问答助手
            capabilities:
              streaming: true
            skills:
              - id: basic-chat
                name: 基础问答
                description: 提供中文基础问答能力
                tags:
                  - chat
                  - agent-cloud
                examples:
                  - 介绍一下 Agent Cloud
            provider:
              organization: Agent Cloud
              url: http://127.0.0.1:9003
